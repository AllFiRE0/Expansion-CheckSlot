name: CheckSlot Expansion

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: mvn clean package --batch-mode
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Expansion-CheckSlot
        path: target/Expansion-CheckSlot.jar
    
    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        name: CheckSlot v1.1.0
        tag_name: v1.1.0
        files: target/Expansion-CheckSlot.jar
        body: |
          ## CheckSlot Expansion для PlaceholderAPI
          
          ### Без ника (текущий игрок):
          - `%checkslot_name_<slot>_<fallback>%`
          - `%checkslot_rawname_<slot>_<fallback>%`
          - `%checkslot_data_<slot>_<fallback>%`
          - `%checkslot_lore_<slot>_<fallback>%`
          - `%checkslot_lore-1_<slot>_<fallback>%`
          - `%checkslot_enchants_<slot>_<fallback>%`
          - `%checkslot_rawenchants_<slot>_<fallback>%`
          - `%checkslot_potion_<slot>_<fallback>%`
          - `%checkslot_rawpotion_<slot>_<fallback>%`
          - `%checkslot_attribute_<slot>_<fallback>%`
          - `%checkslot_rawattribute_<slot>_<fallback>%`
          - `%checkslot_durability_<slot>_<fallback>%`
          - `%checkslot_maxdurability_<slot>_<fallback>%`
          
          ### С ником:
          - `%checkslot_<player>_name_<slot>_<fallback>%`
          
          ### С плейсхолдером:
          - `%checkslot_{placeholder}_name_<slot>_<fallback>%`
          
          ### Слоты:
          `0-40`, `helmet`, `chestplate`, `leggings`, `boots`, `offhand`
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
